<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>失物招领 - 搜索</title>
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/nav.css">
    <link rel="stylesheet" href="../css/body.css">
    <link rel="stylesheet" href="../css/search.css">
    <link rel="stylesheet" href="../css/compat.css">
</head>
<body>
    <nav>
        <span class="nav-side-spacer" aria-hidden="true"></span>
        <div class="navtitle"><strong>失物招领</strong></div>
        <a href="home.html">首页</a>
        <a href="search.html" class="active">搜索</a>
        <a href="lost.html">失物信息</a>
        <a href="found.html">认领信息</a>
        <a href="person.html">个人中心</a>
        <a href="login.html" class="nav-logout" title="退出登录" aria-label="退出登录">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                <polyline points="16 17 21 12 16 7"/>
                <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
        </a>
    </nav>
    <div class="mid">
        <section class="search-section">
            <h1>搜索失物</h1>
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="输入物品名称、丢失地点或关键词…">
                <button type="button" id="searchBtn">搜索</button>
            </div>
            <div class="search-filters">
                <span class="filter-label">分类：</span>
                <button type="button" class="filter-btn active">全部</button>
                <button type="button" class="filter-btn">证件</button>
                <button type="button" class="filter-btn">电子设备</button>
                <button type="button" class="filter-btn">衣物</button>
                <button type="button" class="filter-btn">其他</button>
            </div>
        </section>
        <section class="carousel-area">
            <ul id="banner" class="banner"></ul>
            <div class="slide-detail" id="slideDetail"></div>
        </section>
    </div>
    <footer class="foot">
        <p>失物招领平台</p>
        <p>让遗失与重逢更简单</p>
    </footer>
    <script src="../js/search.js"></script>
</body>
</html>
